name: Sync package lock metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile metadata only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          rm -f .github/workflows/sync-package-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/sync-package-lock.yml
          if git diff --cached --quiet; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git commit -m 'chore: sync package lock metadata'
          git push origin HEAD:main
