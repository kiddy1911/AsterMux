name: Apply v0.1.1 port patch

on:
  push:
    branches:
      - release/port-8787

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/port-8787
          fetch-depth: 0
      - name: Apply audited patch
        run: |
          git apply --check .v011-port.patch
          git apply .v011-port.patch
          rm -f .v011-port.patch .github/workflows/apply-v011.yml
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: move default port to 8787'
          git push origin HEAD:release/port-8787
